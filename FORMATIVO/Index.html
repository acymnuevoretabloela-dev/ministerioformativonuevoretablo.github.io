<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ministerio Formativo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
        }

        header {
            background-color: #0d2a58;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-buttons a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img src="ruta_a_tu_logo.png" alt="Logo" width="40">
            <span>IACyM Nuevo Retablo</span>
        </div>
        <nav class="nav-buttons">
            <a href="#">Página Principal</a>
            <a href="#">ELA</a>
            <a href="#">Adolescentes</a>
            <a href="#">Jóvenes</a>
        </nav>
    </header>

</body>
</html>
